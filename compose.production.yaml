x-topwebcrm-environment: &topwebcrm-environment
  APP_NAME: ${TOPWEBCRM_APP_NAME:-TopwebCRM}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${TOPWEBCRM_DOMAIN:-crm.scgroup.com.br}
  APP_TIMEZONE: America/Sao_Paulo
  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: en
  APP_CURRENCY: BRL
  APP_KEY_FILE: /run/secrets/topwebcrm_app_key
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: topwebcrm_db
  DB_PORT: "3306"
  DB_DATABASE: topwebcrm
  DB_USERNAME: topwebcrm
  DB_PASSWORD_FILE: /run/secrets/topwebcrm_db_password
  DB_PREFIX: ${TOPWEBCRM_DB_PREFIX:-}
  CACHE_STORE: redis
  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: "true"
  REDIS_HOST: topwebcrm_redis
  REDIS_PORT: "6379"
  REDIS_QUEUE_RETRY_AFTER: ${TOPWEBCRM_QUEUE_RETRY_AFTER:-180}
  MAIL_MAILER: smtp
  MAIL_HOST: ${TOPWEBCRM_MAIL_HOST:-smtp.zoho.com.br}
  MAIL_PORT: ${TOPWEBCRM_MAIL_PORT:-465}
  MAIL_ENCRYPTION: ${TOPWEBCRM_MAIL_ENCRYPTION:-ssl}
  MAIL_USERNAME: ${TOPWEBCRM_MAIL_USERNAME:-contato@agenciarenascimento.com.br}
  MAIL_PASSWORD_FILE: /run/secrets/topwebcrm_mail_password
  MAIL_FROM_ADDRESS: ${TOPWEBCRM_MAIL_FROM_ADDRESS:-contato@agenciarenascimento.com.br}
  MAIL_FROM_NAME: ${TOPWEBCRM_APP_NAME:-TopwebCRM}
  TOPWEB_CHAT_PUBLIC_URL: https://${TOPWEBCRM_DOMAIN:-crm.scgroup.com.br}
  TOPWEB_CHAT_HISTORY_BATCH_SIZE: ${TOPWEB_CHAT_HISTORY_BATCH_SIZE:-20}
  TOPWEB_CHAT_SEND_MAX_ATTEMPTS: ${TOPWEB_CHAT_SEND_MAX_ATTEMPTS:-5}
  SENSITIVE_DATA_DISK: private
  WAIT_FOR_DATABASE: "true"
  DB_WAIT_TIMEOUT: ${TOPWEBCRM_DB_WAIT_TIMEOUT:-120}

x-topwebcrm-runtime: &topwebcrm-runtime
  image: ghcr.io/thinkindigital/topwebcrm:${TOPWEBCRM_IMAGE_TAG:-main}
  environment: *topwebcrm-environment
  secrets:
    - topwebcrm_app_key
    - topwebcrm_db_password
    - topwebcrm_mail_password
  volumes:
    - topwebcrm_storage:/var/www/html/storage

services:
  topwebcrm_app:
    <<: *topwebcrm-runtime
    networks:
      - topwebcrm_data
      - topwebcrm_integrations
      - proxy
    environment:
      <<: *topwebcrm-environment
      RUN_MIGRATIONS: ${TOPWEBCRM_RUN_MIGRATIONS:-true}
      RUN_INITIAL_INSTALL: ${TOPWEBCRM_INITIAL_INSTALL:-false}
      ADMIN_NAME: ${TOPWEBCRM_ADMIN_NAME:-TopwebCRM Admin}
      ADMIN_EMAIL: ${TOPWEBCRM_ADMIN_EMAIL:-admin@scgroup.com.br}
      ADMIN_PASSWORD_FILE: /run/secrets/topwebcrm_admin_password
    secrets:
      - topwebcrm_app_key
      - topwebcrm_db_password
      - topwebcrm_mail_password
      - topwebcrm_admin_password
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        order: stop-first
      placement:
        constraints:
          - node.labels.topwebcrm == true
      resources:
        limits:
          cpus: ${TOPWEBCRM_APP_CPUS:-1.0}
          memory: ${TOPWEBCRM_APP_MEMORY:-1024M}
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TOPWEBCRM_PROXY_NETWORK:-renacesso}
        - traefik.http.routers.topwebcrm.rule=Host(`${TOPWEBCRM_DOMAIN:-crm.scgroup.com.br}`)
        - traefik.http.routers.topwebcrm.entrypoints=websecure
        - traefik.http.routers.topwebcrm.tls=true
        - traefik.http.routers.topwebcrm.tls.certresolver=letsencryptresolver
        - traefik.http.routers.topwebcrm.service=topwebcrm
        - traefik.http.services.topwebcrm.loadbalancer.server.port=8080

  topwebcrm_queue:
    <<: *topwebcrm-runtime
    healthcheck:
      disable: true
    networks:
      - topwebcrm_data
      - topwebcrm_integrations
    stop_grace_period: ${TOPWEBCRM_QUEUE_STOP_GRACE_PERIOD:-150s}
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=2
      - --tries=3
      - --timeout=120
      - --max-time=3600
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.topwebcrm == true
      resources:
        limits:
          cpus: ${TOPWEBCRM_QUEUE_CPUS:-0.75}
          memory: ${TOPWEBCRM_QUEUE_MEMORY:-512M}

  topwebcrm_scheduler:
    <<: *topwebcrm-runtime
    healthcheck:
      disable: true
    networks:
      - topwebcrm_data
      - topwebcrm_integrations
    command:
      - php
      - artisan
      - schedule:work
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.labels.topwebcrm == true
      resources:
        limits:
          cpus: ${TOPWEBCRM_SCHEDULER_CPUS:-0.25}
          memory: ${TOPWEBCRM_SCHEDULER_MEMORY:-256M}

  topwebcrm_db:
    image: percona/percona-server:latest@sha256:a4ba7d1afd325f40bc6d65b6455fb4f15388638dfa39e3b85f9755755fd9ec2d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=512M
    environment:
      MYSQL_DATABASE: topwebcrm
      MYSQL_USER: topwebcrm
      MYSQL_PASSWORD_FILE: /run/secrets/topwebcrm_db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/topwebcrm_db_root_password
      TZ: America/Sao_Paulo
    secrets:
      - topwebcrm_db_password
      - topwebcrm_db_root_password
    networks:
      - topwebcrm_data
    volumes:
      - topwebcrm_db:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$(cat /run/secrets/topwebcrm_db_root_password) mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.labels.topwebcrm == true
      resources:
        limits:
          cpus: ${TOPWEBCRM_DB_CPUS:-0.75}
          memory: ${TOPWEBCRM_DB_MEMORY:-768M}

  topwebcrm_redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    networks:
      - topwebcrm_data
    volumes:
      - topwebcrm_redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.labels.topwebcrm == true
      resources:
        limits:
          cpus: ${TOPWEBCRM_REDIS_CPUS:-0.25}
          memory: ${TOPWEBCRM_REDIS_MEMORY:-256M}

volumes:
  topwebcrm_storage:
    external: true
    name: ${TOPWEBCRM_STORAGE_VOLUME:-topwebcrm_storage}
  topwebcrm_db:
    external: true
    name: ${TOPWEBCRM_DB_VOLUME:-topwebcrm_db}
  topwebcrm_redis:
    external: true
    name: ${TOPWEBCRM_REDIS_VOLUME:-topwebcrm_redis}

networks:
  topwebcrm_data:
    driver: overlay
    internal: true
  topwebcrm_integrations:
    external: true
    name: ${TOPWEBCRM_INTEGRATIONS_NETWORK:-topweb_integrations}
  proxy:
    external: true
    name: ${TOPWEBCRM_PROXY_NETWORK:-renacesso}

secrets:
  topwebcrm_app_key:
    external: true
  topwebcrm_db_password:
    external: true
  topwebcrm_db_root_password:
    external: true
  topwebcrm_mail_password:
    external: true
  topwebcrm_admin_password:
    external: true
