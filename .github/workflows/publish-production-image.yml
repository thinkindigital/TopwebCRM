name: Publish production image

on:
  pull_request:
    paths:
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - packages/**
      - public/**
      - docker/php/**
      - .github/workflows/publish-production-image.yml
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: topwebcrm-production-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Validate production image build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/php/Dockerfile.production
          platforms: linux/amd64
          push: false
          tags: topwebcrm:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PORTAINER_URL: https://painel.agenciarenascimento.com.br
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_ENDPOINT_ID: '1'
      PORTAINER_STACK_NAME: topwebcrm
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Resolve release commit
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            release_sha="$WORKFLOW_RUN_SHA"
          else
            release_sha="$DISPATCH_SHA"
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$release_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/php/Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/thinkindigital/topwebcrm:${{ steps.release.outputs.image_tag }}
            ghcr.io/thinkindigital/topwebcrm:main
          labels: |
            org.opencontainers.image.source=https://github.com/thinkindigital/TopwebCRM
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy Portainer stack
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail

          if [ -z "$PORTAINER_API_KEY" ]; then
            echo "::error::Configure the PORTAINER_API_KEY repository secret."
            exit 1
          fi

          auth_header="X-API-Key: $PORTAINER_API_KEY"
          stack_json="$(
            curl --fail --silent --show-error \
              --header "$auth_header" \
              "$PORTAINER_URL/api/stacks/name/$PORTAINER_STACK_NAME"
          )"
          stack_id="$(jq -er '.Id' <<<"$stack_json")"

          stack_file_json="$(
            curl --fail --silent --show-error \
              --header "$auth_header" \
              "$PORTAINER_URL/api/stacks/$stack_id/file"
          )"
          stack_file="$(jq -er '.StackFileContent' <<<"$stack_file_json")"

          stack_env="$(
            jq -c --arg image_tag "$IMAGE_TAG" '
              .Env
              | map(
                  if .name == "TOPWEBCRM_IMAGE_TAG"
                  then .value = $image_tag
                  else .
                  end
                )
              | if any(.name == "TOPWEBCRM_IMAGE_TAG")
                then .
                else . + [{name: "TOPWEBCRM_IMAGE_TAG", value: $image_tag}]
                end
            ' <<<"$stack_json"
          )"

          payload="$(
            jq -n \
              --arg stack_file "$stack_file" \
              --argjson stack_env "$stack_env" \
              '{
                StackFileContent: $stack_file,
                Env: $stack_env,
                Prune: false,
                RepullImageAndRedeploy: true
              }'
          )"

          update_json="$(
            curl --fail --silent --show-error \
              --request PUT \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data-binary "$payload" \
              "$PORTAINER_URL/api/stacks/$stack_id?endpointId=$PORTAINER_ENDPOINT_ID"
          )"

          jq -e --argjson stack_id "$stack_id" '
            .Id == $stack_id and .Status == 1
          ' <<<"$update_json" >/dev/null
