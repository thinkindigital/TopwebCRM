name: Publish dev image

on:
  workflow_run:
    workflows:
      - TopwebChat | Root E2E
    types:
      - completed
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: topwebcrm-dev-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PORTAINER_URL: https://painel.agenciarenascimento.com.br
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_ENDPOINT_ID: '1'
      PORTAINER_STACK_NAME: topwebcrm-dev
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Resolve release commit
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_sha="$DISPATCH_SHA"
          else
            release_sha="$WORKFLOW_RUN_SHA"
          fi
           {
             echo "sha=$release_sha"
             echo "image_tag=sha-$release_sha"
             echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
           } >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Resolve release scope
        id: scope
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files="$(gh api "repos/${{ github.repository }}/commits/$RELEASE_SHA" --jq '.files[].filename')"
          scope="$(printf '%s\n' "$files" | bash .github/scripts/release-scope.sh)"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          {
            echo "### Escopo do release dev \`$scope\`"
            echo ""
            printf '%s\n' "$files" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        if: steps.scope.outputs.scope == 'runtime'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/php/Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/thinkindigital/topwebcrm:${{ steps.release.outputs.image_tag }}
            ghcr.io/thinkindigital/topwebcrm:dev
          labels: |
            org.opencontainers.image.source=https://github.com/thinkindigital/TopwebCRM
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy Portainer dev stack
        if: steps.scope.outputs.scope == 'runtime'
        shell: bash
        env:
          IMAGE_TAG: dev
          IMAGE_REVISION: ${{ steps.release.outputs.image_tag }}
          BUILD_SHA: ${{ steps.release.outputs.sha }}
          BUILD_TIMESTAMP: ${{ steps.release.outputs.build_timestamp }}
          BUILD_BRANCH: dev
        run: |
          set -euo pipefail

          if [ -z "$PORTAINER_API_KEY" ]; then
            echo "::error::Configure the PORTAINER_API_KEY repository secret."
            exit 1
          fi

          auth_header="X-API-Key: $PORTAINER_API_KEY"
          stacks_json="$(
            curl --fail --silent --show-error \
              --header "$auth_header" \
              "$PORTAINER_URL/api/stacks"
          )"
          stack_json="$(
            jq -cer \
              --arg stack_name "$PORTAINER_STACK_NAME" \
              --argjson endpoint_id "$PORTAINER_ENDPOINT_ID" \
              '[
                .[]
                | select(
                    .Name == $stack_name
                    and .EndpointId == $endpoint_id
                  )
              ]
              | if length == 1
                then .[0]
                else error("Expected exactly one matching Portainer stack")
                end' <<<"$stacks_json"
          )"
          stack_id="$(jq -er '.Id' <<<"$stack_json")"

          stack_file_json="$(
            curl --fail --silent --show-error \
              --header "$auth_header" \
              "$PORTAINER_URL/api/stacks/$stack_id/file"
          )"
          stack_file="$(jq -er '.StackFileContent' <<<"$stack_file_json")"

          stack_env="$(
            jq -c \
              --arg image_tag "$IMAGE_TAG" \
              --arg image_revision "$IMAGE_REVISION" \
              --arg build_sha "$BUILD_SHA" \
              --arg build_timestamp "$BUILD_TIMESTAMP" \
              --arg build_branch "$BUILD_BRANCH" \
              '
                def setenv($name; $value):
                  if any(.name == $name)
                  then map(if .name == $name then .value = $value else . end)
                  else . + [{name: $name, value: $value}]
                  end;
                .Env
                | setenv("TOPWEBCRM_IMAGE_TAG"; $image_tag)
                | setenv("TOPWEBCRM_IMAGE_REVISION"; $image_revision)
                | setenv("TOPWEBCRM_BUILD_SHA"; $build_sha)
                | setenv("TOPWEBCRM_BUILD_TIMESTAMP"; $build_timestamp)
                | setenv("TOPWEBCRM_BUILD_BRANCH"; $build_branch)
              ' <<<"$stack_json"
          )"

          payload="$(
            jq -n \
              --arg stack_file "$stack_file" \
              --argjson stack_env "$stack_env" \
              '{
                StackFileContent: $stack_file,
                Env: $stack_env,
                Prune: false,
                RepullImageAndRedeploy: true
              }'
          )"

          update_json="$(
            curl --fail --silent --show-error \
              --request PUT \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data-binary "$payload" \
              "$PORTAINER_URL/api/stacks/$stack_id?endpointId=$PORTAINER_ENDPOINT_ID"
          )"

          jq -e --argjson stack_id "$stack_id" '
            .Id == $stack_id and (.Status == 1 or .Status == 3)
          ' <<<"$update_json" >/dev/null

          for attempt in $(seq 1 30); do
            current_stack_json="$(
              curl --fail --silent --show-error \
                --header "$auth_header" \
                "$PORTAINER_URL/api/stacks/$stack_id?endpointId=$PORTAINER_ENDPOINT_ID"
            )"

            if jq -e --argjson stack_id "$stack_id" '
              .Id == $stack_id and .Status == 1
            ' <<<"$current_stack_json" >/dev/null; then
              echo "Portainer stack $PORTAINER_STACK_NAME is active after redeploy."
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "::error::Portainer stack did not become active after redeploy."
              jq '{Id, Status, Message}' <<<"$current_stack_json"
              exit 1
            fi

            sleep 2
          done
